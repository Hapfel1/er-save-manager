name: Upload Release to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to upload, for example v0.11.1
        required: true
        type: string

concurrency:
  group: nexusmods-${{ github.event.release.tag_name || github.event.inputs.version || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload-to-nexusmods:
    name: Upload ${{ matrix.platform }} to Nexus Mods
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: Linux
            asset_suffix: Linux.AppImage
          - platform: Windows
            asset_suffix: Windows.zip
    env:
      GH_TOKEN: ${{ github.token }}
      NEXUSMODS_FILE_ID_LINUX: ${{ vars.NEXUSMODS_FILE_ID_LINUX }}
      NEXUSMODS_FILE_ID_WINDOWS: ${{ vars.NEXUSMODS_FILE_ID_WINDOWS }}
      # v3 API mod id (gameId << 32 | page id): Elden Ring 4333, page 9271.
      # The changelog endpoint returns 404 for the bare page id.
      NEXUSMODS_MOD_ID: "18610093302839"
    steps:
      # Before any other step: checkout cleans the workspace.
      - name: Check out changelog script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/nexus_changelog.py
          sparse-checkout-cone-mode: false

      - name: Validate Nexus Mods configuration
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$NEXUSMODS_API_KEY" ]; then
            echo "Missing required secret: NEXUSMODS_API_KEY" >&2
            exit 1
          fi

          case "${{ matrix.platform }}" in
            Linux)
              group_id="$NEXUSMODS_FILE_ID_LINUX"
              expected_var="NEXUSMODS_FILE_ID_LINUX"
              ;;
            Windows)
              group_id="$NEXUSMODS_FILE_ID_WINDOWS"
              expected_var="NEXUSMODS_FILE_ID_WINDOWS"
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac

          if [ -z "$group_id" ]; then
            echo "Missing required repository variable: $expected_var" >&2
            exit 1
          fi

      - name: Resolve release asset metadata
        id: meta
        run: |
          set -euo pipefail

          requested_version="${{ github.event.release.tag_name || github.event.inputs.version }}"
          if [ -z "$requested_version" ]; then
            echo "Unable to resolve release version from event payload or workflow input." >&2
            exit 1
          fi

          version_no_v="${requested_version#v}"
          version_prefixed="v${version_no_v}"

          if [ "$requested_version" = "$version_prefixed" ]; then
            primary_version="$requested_version"
            alternate_version="$version_no_v"
          else
            primary_version="$requested_version"
            alternate_version="$version_prefixed"
          fi

          asset_name="er-save-manager_${version_no_v}_${{ matrix.asset_suffix }}"

          case "${{ matrix.platform }}" in
            Linux)
              file_group_id="$NEXUSMODS_FILE_ID_LINUX"
              ;;
            Windows)
              file_group_id="$NEXUSMODS_FILE_ID_WINDOWS"
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac

          case "${{ matrix.platform }}" in
            Linux)
              upload_filename="er-save-manager_${version_no_v}_Linux.zip"
              ;;
            Windows)
              upload_filename="$asset_name"
              ;;
          esac

          echo "requested_version=$requested_version" >> "$GITHUB_OUTPUT"
          echo "primary_version=$primary_version" >> "$GITHUB_OUTPUT"
          echo "alternate_version=$alternate_version" >> "$GITHUB_OUTPUT"
          echo "version_no_v=$version_no_v" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "upload_filename=$upload_filename" >> "$GITHUB_OUTPUT"
          echo "file_group_id=$file_group_id" >> "$GITHUB_OUTPUT"

      - name: Download GitHub release asset
        id: download
        run: |
          set -euo pipefail

          mkdir -p nexusmods-upload

          downloaded=0
          used_version=""

          for version in "${{ steps.meta.outputs.primary_version }}" "${{ steps.meta.outputs.alternate_version }}"; do
            if [ -z "$version" ] || [ "$version" = "$used_version" ]; then
              continue
            fi

            echo "Trying to download asset from release tag: $version"
            if gh release download "$version" \
              --repo "${{ github.repository }}" \
              --pattern "${{ steps.meta.outputs.asset_name }}" \
              --dir nexusmods-upload; then
              downloaded=1
              used_version="$version"
              break
            fi
          done

          if [ "$downloaded" -ne 1 ]; then
            echo "Failed to download asset '${{ steps.meta.outputs.asset_name }}' from releases '${{ steps.meta.outputs.primary_version }}' and '${{ steps.meta.outputs.alternate_version }}'." >&2
            echo "Verify the release tag and asset name in GitHub Releases." >&2
            exit 1
          fi

          echo "resolved_version=$used_version" >> "$GITHUB_OUTPUT"

      # Nexus appends changelog text on every call for a version, so only one
      # platform sends it. The text is the version's CHANGELOG.md section on
      # the release branch, then on main: the tag and the draft release notes
      # are made before later edits on the release branch, and a release can
      # be published before its PR is merged. The release notes are the last
      # fallback.
      - name: Build Nexus changelog from CHANGELOG.md
        id: changelog
        if: matrix.platform == 'Windows'
        run: |
          set -euo pipefail

          tag="${{ steps.download.outputs.resolved_version }}"
          : > release_body.md
          for ref in "release-v${tag#v}" main; do
            if gh api "repos/${{ github.repository }}/contents/CHANGELOG.md?ref=$ref" \
              -H "Accept: application/vnd.github.raw" > CHANGELOG.md 2>/dev/null; then
              awk -v header="## 📦 Release ${tag#v}" '
                /^## 📦 Release / { keep = ($0 == header) }
                keep { print }
              ' CHANGELOG.md > release_body.md
            fi
            if [ -s release_body.md ]; then
              echo "Changelog from CHANGELOG.md on $ref."
              break
            fi
          done
          if [ ! -s release_body.md ]; then
            echo "No CHANGELOG.md section for $tag, using the release notes."
            gh release view "$tag" --repo "${{ github.repository }}" \
              --json body --jq .body > release_body.md
          fi
          text=$(python3 scripts/nexus_changelog.py < release_body.md)
          if [ -z "$text" ]; then
            echo "Release notes are empty, no changelog is added on Nexus Mods."
          fi
          {
            echo "text<<NEXUS_CHANGELOG_EOF"
            echo "$text"
            echo "NEXUS_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Zip Linux AppImage
        if: matrix.platform == 'Linux'
        run: |
          cd nexusmods-upload
          zip "${{ steps.meta.outputs.upload_filename }}" \
              "${{ steps.meta.outputs.asset_name }}"

      - name: Upload artifact to Nexus Mods
        id: upload
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.meta.outputs.file_group_id }}
          filename: nexusmods-upload/${{ steps.meta.outputs.upload_filename }}
          display_name: Elden Ring Save File Manager ${{ steps.meta.outputs.version_no_v }} - ${{ matrix.platform }}
          description: |
            Automated upload for Elden Ring Save File Manager ${{ steps.download.outputs.resolved_version }} (${{ matrix.platform }}).
            Source release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.download.outputs.resolved_version }}
          version: ${{ steps.meta.outputs.version_no_v }}
          update_mod_version: true
          archive_existing_version: true
          allow_mod_manager_download: false
          mod_id: ${{ steps.changelog.outputs.text != '' && env.NEXUSMODS_MOD_ID || '' }}
          changelog: ${{ steps.changelog.outputs.text }}