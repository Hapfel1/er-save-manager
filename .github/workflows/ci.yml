name: CI
on:
  pull_request:
    branches:
      - main
  push:
    # Release branches are handled by release.yml, not this workflow
    branches-ignore:
      - 'release-*'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    # Build on the oldest supported Ubuntu LTS so the bundled libpython and
    # system libs only require glibc 2.35, not the runner's newer glibc.
    container: ubuntu:22.04
    needs: checks
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl lsb-release binutils file \
            libtk8.6 libtcl8.6 libreadline8 libxft2 libxss1 libx11-6 libfontconfig1 \
            libsqlite3-0 libffi8 libssl3 libbz2-1.0 liblzma5 zlib1g libncursesw6 \
            libuuid1 libgdbm6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Get version from pyproject.toml
        run: echo "version=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Build Linux with pyinstaller
        run: uv run ./build-linux.sh
      - name: Package as AppImage
        run: ./package-linux.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: er-save-manager-linux
          path: dist/linux-${{ env.version }}/er-save-manager.AppImage

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Get version
        run: echo "version=$(uv version --short)" >> $env:GITHUB_ENV
      - name: Build Windows with cx_Freeze
        run: uv run ./build-windows.py build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: er-save-manager-windows
          path: dist/windows-${{ env.version }}
