name: CI
on:
  pull_request:
    branches:
      - main
  push:
    # Release branches are handled by release.yml, not this workflow
    branches-ignore:
      - 'release-*'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    # Build on the oldest supported Ubuntu LTS so the bundled libpython and
    # system libs only require glibc 2.35, not the runner's newer glibc.
    container: ubuntu:22.04
    needs: checks
    env:
      # Fail instead of silently building with a uv-managed Python, whose
      # Tk lacks Xft and renders bitmap fonts.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl lsb-release binutils file \
            libtk8.6 libtcl8.6 libreadline8 libxft2 libxss1 libx11-6 libfontconfig1 \
            libsqlite3-0 libffi8 libssl3 libbz2-1.0 liblzma5 zlib1g libncursesw6 \
            libuuid1 libgdbm6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        env:
          # The host's mounted tool cache holds a Python built for the host
          # (glibc 2.39) that cannot run here; use a separate cache so the
          # 22.04 build is downloaded.
          AGENT_TOOLSDIRECTORY: /opt/toolcache
          # Container HOME is not owned by root; skip the unused pip cache.
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Get version from pyproject.toml
        run: echo "version=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Build Linux with pyinstaller
        run: uv run ./build-linux.sh
      - name: Package as AppImage
        run: ./package-linux.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: er-save-manager-linux
          path: dist/linux-${{ env.version }}/er-save-manager.AppImage

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Get version
        run: echo "version=$(uv version --short)" >> $env:GITHUB_ENV
      - name: Build Windows with cx_Freeze
        run: uv run ./build-windows.py build
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: er-save-manager-windows
          path: dist/windows-${{ env.version }}
